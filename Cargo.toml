[package]
name = "latchkey"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Sign-in for a small axum app: password with a second factor, passkeys, TOTP, email sign-in links, recovery codes and first-open owner setup"
repository = "https://github.com/somethim/latchkey"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["authentication", "axum", "passkey", "totp", "webauthn"]
categories = ["authentication", "web-programming::http-server"]
exclude = ["/.github"]

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = "0.6.0"
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["json", "query", "tokio"] }
base64 = "0.22.1"
hmac = "0.13.0"
rand = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
subtle = "2.6.1"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["serde"] }
tokio = { version = "1.48.0", features = ["sync", "rt", "time"] }
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "otpauth"] }
tracing = "0.1.41"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
webauthn-rs = { version = "0.5.5", features = ["conditional-ui"] }

[dev-dependencies]
axum = { version = "0.8.9", features = ["macros"] }
http-body-util = "0.1.3"
tokio = { version = "1.48.0", features = ["full"] }
tower = { version = "0.5.2", features = ["util"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }
webauthn-rs-proto = "0.5.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
